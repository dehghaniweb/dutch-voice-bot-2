name: Dutch Voice Bot 2

on:
  workflow_dispatch:
    inputs:
      voice_text:
        description: "Dutch text"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install python-telegram-bot playwright
          playwright install chromium

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          VOICE_TEXT: ${{ github.event.inputs.voice_text }}
        run: python bot.py
